plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.quickdraw.redirect'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.quickdraw.redirect'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external libraries: plain Android framework only, so the build is small and quick.
