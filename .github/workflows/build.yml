name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk QuickDrawRedirect.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickDrawRedirect-apk
          path: QuickDrawRedirect.apk

      - name: Publish to the "latest" release (direct download link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest QuickDrawRedirect.apk \
            --title "Quick Draw Redirect (latest build)" \
            --notes "Built from ${GITHUB_SHA}. Download QuickDrawRedirect.apk on your MovinkPad and install it. See README for setup." \
            --target "${GITHUB_SHA}"
